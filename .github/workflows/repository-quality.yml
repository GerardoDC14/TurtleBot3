name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata-and-python:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate repository structure and package metadata
        run: python3 tools/repository_health.py
